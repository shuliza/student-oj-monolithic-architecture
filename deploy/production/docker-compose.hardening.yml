services:
  mysql:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    environment:
      TZ: Asia/Shanghai
  redis:
    restart: unless-stopped
    ports: !reset []
  app:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    ports: !reset []
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      STUDENTOJ_CORS_ALLOWED_ORIGINS: ${STUDENTOJ_CORS_ALLOWED_ORIGINS:-https://imsteven.cloud,https://www.imsteven.cloud}
  web:
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
