services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_oj
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./deploy/mysql/leetcode-problems-full.sql:/docker-entrypoint-initdb.d/02-problems.sql:ro
      - ./deploy/mysql/session-version-upgrade.sql:/docker-entrypoint-initdb.d/03-session-version-upgrade.sql:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--max-connections=300"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: student-oj-app:${STUDENTOJ_IMAGE_TAG:-0.1.0}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: app
    environment:
      SERVER_PORT: "8080"
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: student_oj
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SANDBOX_MYSQL_DATABASE: student_oj_sandbox
      SANDBOX_MYSQL_USERNAME: sandbox
      SANDBOX_MYSQL_PASSWORD: sandbox123
      STUDENTOJ_AUTH_INTERNAL_SECRET: student-oj-internal-v1
      STUDENTOJ_CORS_ALLOWED_ORIGINS: ${STUDENTOJ_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      STUDENTOJ_AI_MODE: ${STUDENTOJ_AI_MODE:-auto}
      LEETCODE_CRAWLER_ENABLED: ${LEETCODE_CRAWLER_ENABLED:-true}
      LEETCODE_GRAPHQL_URL: ${LEETCODE_GRAPHQL_URL:-https://leetcode.cn/graphql}
      LEETCODE_BASE_URL: ${LEETCODE_BASE_URL:-https://leetcode.cn}
      LEETCODE_COOKIE: ${LEETCODE_COOKIE:-}
      LEETCODE_SYNC_ON_STARTUP: ${LEETCODE_SYNC_ON_STARTUP:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    image: student-oj-web:${STUDENTOJ_IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      TZ: Asia/Shanghai

volumes:
  mysql-data:
